# Limine configuration for Prayogshala OS
# This file is copied to the ISO's limine directory

entry prayogshala:
    # Kernel ELF file
    file boot/limine/prayogshala.elf

    # Command line arguments
    args "prayogshala.os"

    # Framebuffer settings (optional - will use UEFI GOP if available)
    # framebuffer_width 1920
    # framebuffer_height 1080
    # framebuffer_bpp 32